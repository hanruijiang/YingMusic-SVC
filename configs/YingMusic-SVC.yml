preprocess_params:
  sr: 44100
  spect_params:
    n_fft: 2048
    win_length: 2048
    hop_length: 512
    n_mels: 128
    fmin: 0
    fmax: null

model_params:

  vocoder:
    type: "bigvgan"
    name: "nvidia/bigvgan_v2_44khz_128band_512x"

  speech_tokenizer:
    type: "whisper"
    name: 'openai/whisper-small'

  style_encoder:
    dim: 192

  length_regulator:
    channels: 768
    in_channels: 768
    sampling_ratios: [1, 1, 1, 1]
    f0_condition: true
    n_f0_bins: 256
    use_style_residual: true
    residual_alpha: 0.5

  DiT:
    hidden_dim: 768
    num_heads: 12
    depth: 17
    in_channels: 128
    style_condition: true
    content_dim: 768
    zero_prompt_speech_token: false
    uvit_skip_connection: true
